apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksense-collector
  namespace: ksense
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ksense-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ksense-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ksense-collector
subjects:
  - kind: ServiceAccount
    name: ksense-collector
    namespace: ksense
